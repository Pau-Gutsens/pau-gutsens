<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#0a0c13; font-family:'JetBrains Mono', monospace;">
  <defs>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background grid -->
  <rect width="800" height="450" fill="url(#gridGlow)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="25" width="220" height="32" rx="6" fill="#151b2a" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
  <text x="55" y="46" fill="#00f0ff" font-size="12" font-weight="bold" letter-spacing="1">PUZZLE SCHEMATIC // 01</text>

  <!-- Outer Walls -->
  <rect x="60" y="75" width="680" height="300" rx="12" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 6"/>

  <!-- Rule Block 1: BABA IS YOU -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#be185d"/>
    <text x="35" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">BABA</text>

    <rect x="80" y="0" width="50" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="105" y="25" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">IS</text>

    <rect x="140" y="0" width="60" height="40" rx="6" fill="#be185d"/>
    <text x="170" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">YOU</text>
  </g>

  <!-- Rule Block 2: FLAG IS WIN -->
  <g transform="translate(480, 110)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#ca8a04"/>
    <text x="35" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">FLAG</text>

    <rect x="80" y="0" width="50" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="105" y="25" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">IS</text>

    <rect x="140" y="0" width="60" height="40" rx="6" fill="#ca8a04"/>
    <text x="170" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">WIN</text>
  </g>

  <!-- Inner Barrier / Maze -->
  <path d="M 380,160 L 380,310 M 380,240 L 460,240" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>

  <!-- Character / Entities -->
  <!-- Baba entity -->
  <g transform="translate(180, 250)">
    <circle cx="20" cy="20" r="22" fill="rgba(255, 255, 255, 0.1)" stroke="#00f0ff" stroke-width="2" filter="url(#neon)"/>
    <text x="20" y="26" font-size="20" text-anchor="middle">🐑</text>
    <text x="20" y="55" fill="#00f0ff" font-size="10" font-weight="bold" text-anchor="middle">PLAYER</text>
  </g>

  <!-- Solution Vector Path -->
  <path d="M 220,270 Q 300,320 370,270 T 520,270" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 4" filter="url(#neon)"/>
  <polygon points="525,270 515,264 515,276" fill="#00f0ff"/>

  <!-- Rule Block 3: ROCK IS PUSH -->
  <g transform="translate(240, 310)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#78350f"/>
    <text x="35" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">ROCK</text>

    <rect x="80" y="0" width="50" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="105" y="25" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">IS</text>

    <rect x="140" y="0" width="70" height="40" rx="6" fill="#78350f"/>
    <text x="175" y="25" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">PUSH</text>
  </g>

  <!-- Flag Goal -->
  <g transform="translate(580, 240)">
    <circle cx="25" cy="25" r="24" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-width="2"/>
    <text x="25" y="32" font-size="22" text-anchor="middle">🚩</text>
    <text x="25" y="62" fill="#eab308" font-size="10" font-weight="bold" text-anchor="middle">GOAL (WIN)</text>
  </g>

  <!-- Design Annotations -->
  <text x="80" y="415" fill="#64748b" font-size="11">RULE ECONOMY: 3 ACTIVE SENTENCES</text>
  <text x="450" y="415" fill="#64748b" font-size="11">NON-VERBAL ONBOARDING &amp; EUREKA PIVOT</text>
</svg>
