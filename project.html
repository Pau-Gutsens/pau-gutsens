<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pau Gutsens | Level Design & QA</title>
    <meta name="description"
        content="Portfolio de Level Design y QA de videojuegos por Pau Gutsens.">
    <meta name="keywords"
        content="Pau Gutsens, Level Design, QA Videojuegos, Game QA, Blockout, Unreal Engine, Tiled, Game Design">
    <meta name="author" content="Pau Gutsens">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="project-page-body">

    <!-- Navigation Header -->
    <header class="site-header">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <span class="logo-name">PAU GUTSENS</span>
                <span class="logo-tag" data-i18n="nav_role">LEVEL DESIGN & QA</span>
            </a>

            <div class="nav-actions">
                <a href="index.html#projects" class="btn btn-outline btn-sm back-to-portfolio-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span data-i18n="proj_back_btn">← Volver a Proyectos</span>
                </a>

                <!-- Language Switcher -->
                <div class="lang-switch" id="langSwitch" role="group" aria-label="Language selector">
                    <button class="lang-btn active" data-lang="es" aria-pressed="true">ES</button>
                    <span class="lang-divider">/</span>
                    <button class="lang-btn" data-lang="ca" aria-pressed="false">CA</button>
                    <span class="lang-divider">/</span>
                    <button class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="project-detail-main">
        <div class="container" id="projectDetailContainer">
            <!-- Dynamically populated by renderProjectDetailPage() in app.js -->
        </div>
    </main>

    <!-- Image Lightbox Modal for Fullscreen Zoom -->
    <div class="lightbox-overlay" id="lightboxOverlay" aria-hidden="true">
        <button class="lightbox-close" id="lightboxCloseBtn" aria-label="Cerrar imagen">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img src="" alt="" id="lightboxImg" class="lightbox-image">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <!-- Site Footer -->
    <footer class="site-footer">
        <div class="container footer-container">
            <div class="footer-cta">
                <h2 class="footer-title" data-i18n="contact_title">Contacto</h2>
                <p class="footer-sub" data-i18n="contact_sub">
                    Si buscas un Level Designer o Tester de QA para tu equipo o proyecto, escríbeme.
                </p>

                <div class="contact-links">
                    <a href="mailto:pgutsens@gmail.com" class="btn btn-primary">
                        <i class="fa-solid fa-envelope"></i>
                        <span>pgutsens@gmail.com</span>
                    </a>
                    <a href="https://www.linkedin.com/in/pau-gutsens-sanz-491a90315/" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
                        <i class="fa-brands fa-linkedin"></i>
                        <span>LinkedIn</span>
                    </a>
                </div>
            </div>

            <div class="footer-bottom">
                <div class="footer-copy">
                    © 2026 Pau Gutsens Sanz.
                </div>
                <div class="footer-nav">
                    <a href="index.html#projects" data-i18n="nav_projects">Proyectos</a>
                    <a href="index.html#qa-methodology" data-i18n="nav_qa">QA</a>
                    <a href="about.html" data-i18n="nav_about">Sobre Mí</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
